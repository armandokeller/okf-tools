[project]
name = "okf-tools"
version = "0.1.0"
description = "Tools to query and consume Open Knowledge Format (OKF) data catalogs, usable standalone or integrated with AI agent frameworks."
readme = "README.md"
license = "MIT"
authors = [{ name = "armandokeller" }]
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml>=6"]

[project.optional-dependencies]
langchain = ["langchain-core>=1.0"]
pydantic-ai = ["pydantic-ai-slim>=2.0"]
adk = ["google-adk>=2.0"]

[project.urls]
Homepage = "https://github.com/armandokeller/okf-tools"
Repository = "https://github.com/armandokeller/okf-tools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okf_tools"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6",
    "langchain-core>=1.0",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "pydantic-ai-slim[openai]>=2.0",
    "google-adk>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["okf_tools"]
strict = true
